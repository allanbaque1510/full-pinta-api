name: Laravel

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  laravel-tests:

    runs-on: ubuntu-latest

    # Postgres real, con PostGIS y btree_gist — no SQLite: el motor de
    # disponibilidad depende de `EXCLUDE USING gist`, PostGIS y el tipo de
    # rango `franja`, que SQLite no tiene (ver .claude/skills/disponibilidad
    # y el comentario en phpunit.xml). Mismo motor que `docker-compose.yml`,
    # mapeado al mismo puerto (5433) que ya espera `phpunit.xml`.
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: fullpinta_test
          POSTGRES_USER: fullpinta
          # Descartable: vive y muere con este job, nadie más la ve. Se saca
          # del YAML igual (secret de repo, no literal) porque el detector de
          # secretos de SonarCloud marca cualquier `*_PASSWORD: "valor"`
          # literal como hardcoded credential, sin distinguir el contexto.
          POSTGRES_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U fullpinta -d fullpinta_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
    - uses: shivammathur/setup-php@15c43e89cdef867065b0213be354c2841860869e
      with:
        php-version: '8.3'
        extensions: pgsql, pdo_pgsql
    - uses: actions/checkout@v4
    - name: Copy .env
      run: php -r "file_exists('.env') || copy('.env.example', '.env');"
    - name: Install Dependencies
      run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
    - name: Generate key
      run: php artisan key:generate
    - name: Directory Permissions
      run: chmod -R 777 storage bootstrap/cache
    - name: Prepare Postgres extensions
      env:
        PGPASSWORD: ${{ secrets.TEST_DB_PASSWORD }}
      # Mismas extensiones que `docker/postgres/init/01-init.sql` — en un
      # esquema propio (`extensions`), no en `public`, porque `migrate:fresh`
      # borra todo lo que hay en `public` y ahí PostGIS deja `spatial_ref_sys`.
      run: |
        psql -h 127.0.0.1 -p 5433 -U fullpinta -d fullpinta_test <<'SQL'
        CREATE SCHEMA IF NOT EXISTS extensions AUTHORIZATION fullpinta;
        CREATE EXTENSION IF NOT EXISTS postgis WITH SCHEMA extensions;
        CREATE EXTENSION IF NOT EXISTS btree_gist WITH SCHEMA extensions;
        DO $do$
        BEGIN
            CREATE TYPE extensions.franja AS RANGE (subtype = time);
        EXCEPTION
            WHEN duplicate_object THEN NULL;
        END
        $do$;
        ALTER DATABASE fullpinta_test SET search_path TO public, extensions;
        SQL
    - name: Execute tests (Feature tests) via PHPUnit
      # DB_* de `phpunit.xml` ya apuntan a este mismo Postgres (127.0.0.1:5433,
      # fullpinta_test) — sin overrides de entorno acá para no pisarlos.
      run: php artisan test
