services:
  postgres:
    image: postgis/postgis:17-3.5
    container_name: fullpinta-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fullpinta
      POSTGRES_USER: fullpinta
      POSTGRES_PASSWORD: fullpinta
      TZ: UTC
      PGTZ: UTC
    ports:
      - "5433:5432"
    volumes:
      - fullpinta-pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fullpinta -d fullpinta"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: fullpinta-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  fullpinta-pgdata:
